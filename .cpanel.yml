---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ecollifen/public_html/
    - /bin/rsync -avz --exclude='.git*' --exclude='cpanel.yml' ./ $DEPLOYPATH
    # Purga la caché de LiteSpeed tras cada deploy. Sin esto, LiteSpeed puede
    # seguir sirviendo la versión anterior de una página aunque el archivo en
    # disco ya esté actualizado (nos pasó el 2026-09-03: el sitio entero
    # quedó "caído" con contenido de meses atrás pese a que los archivos en
    # public_html eran correctos). El "|| true" evita que un fallo aquí
    # tumbe el resto del despliegue.
    - "curl -s -H 'Host: ecollifen.cl' -H 'X-LiteSpeed-Purge: *' -o /dev/null http://127.0.0.1/ || true"

